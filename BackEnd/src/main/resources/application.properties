# ─── LOCAL DEV (perfil por defecto) ─────────────────────────────────────────
# Para producción activa el perfil "prod" poniendo en Railway:
#   SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=jdbc:h2:mem:estudiosdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola H2 accesible en http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

# CORS — origenes permitidos (separados por coma)
cors.allowed-origins=http://localhost:4200
