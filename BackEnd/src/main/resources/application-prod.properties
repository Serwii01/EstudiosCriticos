# ─── PRODUCCIÓN (Railway + Supabase) ─────────────────────────────────────────
# Railway inyecta estas variables automáticamente cuando añades un plugin PostgreSQL,
# o puedes añadirlas manualmente en Settings → Variables del servicio.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase exige SSL en conexiones externas
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "update" crea las tablas si no existen y añade columnas nuevas sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}

# CORS — pon aquí tu dominio de Vercel (sin barra final)
# Ejemplo: https://estudios-criticos.vercel.app,http://localhost:4200
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
